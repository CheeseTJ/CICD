name: Deploy

# push 到 main 自动部署到本机（self-hosted runner 与服务同机，docker 部署）
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 支持在 GitHub 页面手动触发

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          # 不清理未跟踪文件，保住持久化的 data/ 目录
          clean: false

      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          GITHUB_TOKEN=${{ secrets.GH_TOKEN }}
          PGYER_API_KEY=${{ secrets.PGYER_API_KEY }}
          PORT=8090
          AUTO_SYNC_INTERVAL=5m
          GITHUB_OWNER=
          # Cloudflare Pages 部署记录（只读展示）
          CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }}
          # 只展示这些 Pages 项目（逗号分隔，留空=全部）
          CF_PAGES_PROJECTS=
          # 显式标识哪些 Worker 是前端静态站（逗号分隔，如 remind-web）。
          #
          # 留空 = 自动纳入「绑定了自定义域的 Worker」——Pages 全部迁到 Workers 后
          # 就是这个状态，届时无需维护本项。目前仍显式列出，避免把 music-worker /
          # user-center 这类 API 型 Worker 误当成静态站。
          #
          # 迁移进度：每迁完一个站点就把它的 Worker 名加进来（或迁移全完成后清空）。
          CF_WORKERS_SITES=remind-web
          # 用户中心登录。URL 留空则鉴权关闭、接口对外开放，故这里必须填上。
          # 注意：.env 每次部署都会按本文件重新生成，改配置要改这里，别只改服务器上的 .env。
          USER_CENTER_URL=https://ucenter.june-t.top
          # 本服务在用户中心的标识，决定 JWT 的 aud，需与用户中心 APPS 一致
          USER_CENTER_APP=cicd
          # 邮箱白名单（逗号分隔），在「角色必须是 admin」之上再收窄。
          # 留空=任何管理员都能操作本面板
          ALLOWED_EMAILS=
          # 服务健康监控：「名称=健康接口URL」，逗号分隔，留空=关闭监控视图。
          # 覆盖「服务」视图里的全部 7 个服务 + 本控制台自身：
          #   cicd           本控制台 /api/health
          #   JMReader-api   /api/schedule（时段限制时返回 open=false → 显示暂停开放）
          #   WordRush-api   与 eng.june-t.top 同一服务（/api/health 带 DB 探活）
          #   Ucenter-worker Worker 根路径返回纯文本
          #   Music-worker   自定义域名 valut.june-t.top（不用 xxx.workers.dev：
          #                  该 dev 域名在部分网络不可达，探测会误报不可用）
          #   Music-api      /health
          #   Remind-api     /healthz
          #   Imgbed-api     额外纳入：/api/health 带 DB + R2 探活
          # 容器虽是 host 网络，仍统一走公网域名：顺带验证 Cloudflare 隧道与证书链。
          HEALTH_TARGETS=cicd=/api/health,jmreader=https://jm.june-t.top/api/schedule,wordrush=https://eng.june-t.top/api/health,ucenter-worker=https://ucenter.june-t.top/,music-worker=https://valut.june-t.top/,music-api=https://music.june-t.top/health,remind=https://remind.june-t.top/healthz,imgbed=https://imgbed.june-t.top/api/health
          # 本控制台对外地址：用于预判各健康接口是否允许本页跨域读取
          PUBLIC_ORIGIN=https://cicd.taojun.top
          EOF
          chmod 600 .env

      - name: Backup current image
        run: sudo docker tag cicd-console:latest cicd-console:backup || true

      - name: Build & Up
        run: sudo docker compose up -d --build

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8090/api/health > /dev/null; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "部署失败，回滚旧镜像"
          sudo docker tag cicd-console:backup cicd-console:latest || true
          sudo docker compose up -d --no-build
