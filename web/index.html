    /* ---------- 弹窗 / 菜单 ---------- */
    function openDetail(title, text) {
      document.getElementById('detailTitle').textContent = title;
      document.getElementById('detailBody').textContent = text;
      document.getElementById('detailMask').classList.add('show');
    }

    function closeMenus() {
      document.getElementById('popMenu').classList.remove('show');
    }

    function openMenu(anchor, items) {
      const menu = document.getElementById('popMenu');
      menu.innerHTML = '';
      items.forEach(it => {
        const b = el('button', 'pop-item' + (it.danger ? ' danger' : '') + (it.active ? ' active' : ''));
        if (it.icon) b.insertAdjacentHTML('beforeend', svg(it.icon, 16));
        b.appendChild(el('span', '', it.label));
        if (it.active) b.insertAdjacentHTML('beforeend', '<span class="tick">' + svg('check', 15) + '</span>');
        if (it.disabled) b.disabled = true;
        b.onclick = () => { closeMenus(); it.onClick(); };
        menu.appendChild(b);
      });
      menu.classList.add('show');
      const r = anchor.getBoundingClientRect();
      const mw = menu.offsetWidth;
      const mh = menu.offsetHeight;
      let left = r.right - mw;
      let top = r.bottom + 6;
      if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);
      if (left < 8) left = 8;
      menu.style.left = left + 'px';
      menu.style.top = top + 'px';
    }

    // 用自定义下拉替代原生 select，避免系统白色弹层破坏深色主题
    function setupSortButton(btnId, labels, getValue, apply) {
      const btn = document.getElementById(btnId);
      const label = btn.querySelector('span');
      const sync = () => { label.textContent = labels[getValue()] || Object.values(labels)[0]; };
      btn.insertAdjacentHTML('beforeend', '<span class="chev">' + svg('chevronDown', 15) + '</span>');
      btn.onclick = e => {
        e.stopPropagation();
        openMenu(btn, Object.entries(labels).map(([value, text]) => ({
          label: text,
          active: getValue() === value,
          onClick: () => { apply(value); sync(); }
        })));
      };
      sync();
    }

    // 卡片内只显示简短结果，完整错误信息放进弹窗（避免破坏布局）。
    function showError(msgEl, text) {
      msgEl.innerHTML = '';
      msgEl.className = 'sync-msg err';
      const label = el('span', '', '同步失败');
      label.title = text;
      msgEl.appendChild(label);
      msgEl.appendChild(document.createTextNode(' '));
      const link = el('a', 'detail-link', '详情');
      link.href = 'javascript:void(0)';
      link.title = '查看完整错误信息';
      link.onclick = e => { e.preventDefault(); openDetail('同步失败', text); };
      msgEl.appendChild(link);
    }

    async function pollJob(jobId, handlers) {
      while (true) {
        await sleep(800);
        let j;
        try {
          j = await api('/api/repos/sync/progress?id=' + encodeURIComponent(jobId));
        } catch (e) { handlers.onError(e); return; }
        if (j.status === 'done') { handlers.onDone(j); return; }
        if (j.status === 'error') { handlers.onError(new Error(j.message || '同步失败')); return; }
        handlers.onProgress(j);
      }
    }

    /* ---------- 数据加载 ---------- */
    async function loadHealth() {
      const banner = document.getElementById('banner');
      try {
        health = await api('/api/health');
        authConfig = {
          required: !!health.auth_required,
          app: health.auth_app || 'cicd',
          url: health.user_center_url || ''
        };
        // 未登录时后端只回鉴权字段、不下发配置明细，此时不该报「缺少环境变量」。
        // 首屏也可能带着已过期的令牌来问一次，同样只回鉴权字段；令牌随后会被静默刷新，
        // 因此这里不渲染设置页，等用户真正进入设置页时再补拉一次（见 switchView）。
        if (health.auth_required && health.github_token === undefined) {
          banner.classList.remove('show');
          return;
        }
        const missing = [];
        if (!health.github_token) missing.push('GITHUB_TOKEN');
        if (!health.pgyer_key) missing.push('PGYER_API_KEY');
        if (missing.length) {
          banner.textContent = '缺少环境变量：' + missing.join('、') + '，请在启动服务时配置。';
          banner.classList.add('show');
        } else {
          banner.classList.remove('show');
        }
        renderSettings();
      } catch (e) {
        banner.textContent = '服务异常：' + e.message;
        banner.classList.add('show');
      }
    }

    async function loadRepos() {
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      try {
        const data = await api('/api/repos');
        repos = data.repos || [];
        render();
        renderModal();
        // 应用列表影响部署视图的排除逻辑，已加载过则重渲染一次
        if (deployLoaded) renderDeployments();
      } catch (e) {
        const banner = document.getElementById('banner');
        banner.textContent = '加载仓库失败：' + e.message;
        banner.classList.add('show');
      } finally {
        btn.disabled = false;
      }
    }

    /* ---------- 渲染：统计 ---------- */
    function renderStats(apps) {
      const items = [
        { label: '应用', value: apps.length, icon: 'box' },
        { label: '已同步', value: apps.filter(a => a.last_synced_tag).length, icon: 'check' },
        { label: '自动同步', value: apps.filter(a => a.auto_sync).length, icon: 'refresh' },
        { label: '蒲公英已关联', value: apps.filter(a => a.pgyer_linked).length, icon: 'cloud' }
      ];
      const box = document.getElementById('stats');
      box.innerHTML = '';
      items.forEach(it => {
        const card = el('div', 'stat');
        const icon = el('div', 'stat-icon');
        icon.innerHTML = svg(it.icon, 22);
        card.appendChild(icon);
        const body = el('div', 'stat-body');
        body.appendChild(el('div', 'stat-label', it.label));
        body.appendChild(el('div', 'stat-value', String(it.value)));
        card.appendChild(body);
        const arrow = el('div', 'stat-arrow');
        arrow.innerHTML = svg('chevronRight', 18);
        card.appendChild(arrow);
        box.appendChild(card);
      });
    }

    function statusOf(r) {
      if (r.archived) return { cls: 'off', text: '已停止' };
      if (r.last_synced_tag) return { cls: 'ok', text: '已同步' };
      return { cls: 'warn', text: '待同步' };
    }

    /* ---------- 渲染：卡片 ---------- */
    function renderCard(r) {
      const card = el('div', 'card');

      const top = el('div', 'card-top');
      const st = tileStyle(r.full_name, 'smartphone'); // 应用 = 手机图标
      const tile = el('div', 'tile');
      tile.style.background = st.background;
      tile.innerHTML = svg(st.icon, 22);
      top.appendChild(tile);

      const title = el('div', 'card-title');
      const name = el('div', 'card-name');
      const a = el('a', '', r.full_name);
      a.href = r.html_url; a.target = '_blank'; a.rel = 'noopener';
      name.appendChild(a);
      title.appendChild(name);
      // 没有描述也占位，保证同排卡片内部元素对齐
      title.appendChild(el('div', 'card-desc', r.description || ''));
      top.appendChild(title);

      const moreBtn = el('button', 'icon-btn');
      moreBtn.innerHTML = svg('dots', 18);
      moreBtn.title = '更多操作';
      // 构建信息来自「部署」视图同一份数据（应用仓库不在部署视图重复展示）
      const buildSvc = services.find(s => s.full_name === r.full_name);
      moreBtn.onclick = e => {
        e.stopPropagation();
        openMenu(moreBtn, [
          {
            icon: 'play', label: '查看构建日志',
            disabled: !(buildSvc && buildSvc.latest && buildSvc.latest.html_url),
            onClick: () => window.open(buildSvc.latest.html_url, '_blank', 'noopener')
          },
          {
            icon: 'external', label: '查看 GitHub Release',
            disabled: !r.latest_html_url,
            onClick: () => window.open(r.latest_html_url, '_blank', 'noopener')
          },
          {
            icon: 'smartphone', label: '打开蒲公英下载页',
            disabled: !r.pgyer_shortcut_url,
            onClick: () => window.open(r.pgyer_shortcut_url, '_blank', 'noopener')
          },
          {
            icon: 'trash', label: '从我的应用移除', danger: true,
            onClick: async () => {
              try {
                await api('/api/repos/mark', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ full_name: r.full_name, marked: false })
                });
                await loadRepos();
              } catch (err) { openDetail('操作失败', err.message); }
            }
          }
        ]);
      };
      top.appendChild(moreBtn);
      card.appendChild(top);

      const s = statusOf(r);
      const status = el('span', 'status ' + s.cls);
      status.appendChild(el('span', 'dot'));
      status.appendChild(document.createTextNode(s.text));
      card.appendChild(status);

      const vers = el('div', 'versions');
      const cur = r.pgyer_linked && r.pgyer_version ? 'v' + r.pgyer_version : '—';
      const curNode = el('span', 'cur', cur);
      if (r.pgyer_shortcut_url) {
        curNode.style.cursor = 'pointer';
        curNode.title = '打开蒲公英下载页';
        curNode.onclick = () => window.open(r.pgyer_shortcut_url, '_blank', 'noopener');
      }
      vers.appendChild(curNode);
      const arrow = el('span', 'arrow');
      arrow.innerHTML = svg('arrowRight', 16);
      vers.appendChild(arrow);
      const next = el('span', 'next' + (r.latest_tag ? '' : ' none'), r.latest_tag || '—');
      vers.appendChild(next);
      card.appendChild(vers);

      const ts = syncedUnix(r);
      const time = el('div', 'time');
      time.innerHTML = svg('clock', 14);
      time.appendChild(document.createTextNode(
        ts ? relTime(ts) + '同步' : '尚未同步'
      ));
      time.title = ts ? ('上次同步：' + localTime(ts)) : '尚未同步过';
      card.appendChild(time);

      // 合并构建信息：展示该应用仓库的 Actions 最近运行状态（原「部署」视图内容）
      if (buildSvc && buildSvc.latest) {
        const l = buildSvc.latest;
        const rs = runStatus(l.status);
        const build = el('div', 'build-line');
        const bs = el('span', 'build-status ' + rs.cls);
        bs.appendChild(el('span', 'dot'));
        bs.appendChild(document.createTextNode('构建' + rs.text));
        build.appendChild(bs);
        const meta = el('span', 'build-meta',
          (buildSvc.workflow_names[0] || 'workflow') + ' #' + l.run_number +
          (l.branch ? ' · ' + l.branch : '') + ' · ' + relTime(isoUnix(l.updated_at)));
        build.appendChild(meta);
        const tips = [l.title];
        if (l.duration_sec) tips.push('耗时 ' + formatDur(l.duration_sec));
        build.title = tips.filter(Boolean).join(' · ');
        if (l.html_url) {
          build.classList.add('link');
          build.onclick = () => window.open(l.html_url, '_blank', 'noopener');
        }
        card.appendChild(build);

        if (buildSvc.recent && buildSvc.recent.length > 1) {
          const hist = el('div', 'history');
          buildSvc.recent.slice(1).forEach(rr => {
            const d = el('span', 'hist-dot ' + runStatus(rr.status).cls);
            d.title = rr.name + ' #' + rr.run_number + ' · ' + runStatus(rr.status).text;
            hist.appendChild(d);
          });
          card.appendChild(hist);
        }
      }

      const prog = el('div', 'progress');
      const progBar = el('div', 'progress-bar');
      prog.appendChild(progBar);
      card.appendChild(prog);

      const foot = el('div', 'card-foot');
      const appPlat = platformBadge(r.platform);
      if (appPlat) foot.appendChild(appPlat);
      const swLabel = el('label', 'switch-label');
      const sw = el('span', 'switch' + (r.auto_sync ? ' on' : ''));
      swLabel.appendChild(document.createTextNode('自动同步'));
      swLabel.appendChild(sw);
      swLabel.title = r.auto_sync ? '已开启：发现新 Release 自动发布' : '已关闭';
      swLabel.onclick = async e => {
        e.preventDefault();
        if (swLabel.classList.contains('disabled')) return;
        swLabel.classList.add('disabled');
        const nextOn = !sw.classList.contains('on');
        try {
          await api('/api/repos/autosync', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ full_name: r.full_name, auto_sync: nextOn })
          });
          r.auto_sync = nextOn;
          sw.classList.toggle('on', nextOn);
          swLabel.title = nextOn ? '已开启：发现新 Release 自动发布' : '已关闭';
        } catch (err) {
          showError(msg, err.message);
        } finally {
          swLabel.classList.remove('disabled');
        }
      };
      foot.appendChild(swLabel);

      const right = el('div', 'foot-right');
      const msg = el('span', 'sync-msg');
      right.appendChild(msg);

      const syncBtn = el('button', 'btn primary');
      syncBtn.innerHTML = svg('rocket', 16);
      syncBtn.appendChild(el('span', '', '同步'));
      syncBtn.title = '从 GitHub 拉取最新 Release 的 APK 并发布到蒲公英';
      if (!r.apk_assets.length) {
        syncBtn.disabled = true;
        syncBtn.title = '最新 Release 中没有 .apk 资产';
      }
      syncBtn.onclick = async () => {
        syncBtn.disabled = true;
        swLabel.classList.add('disabled');
        prog.classList.add('on');
        progBar.style.width = '0%';
        msg.className = 'sync-msg';
        msg.innerHTML = '<span class="spin"></span>准备中';
        const names = { prepare: '准备中', download: '下载 APK', upload: '上传蒲公英', publish: '发布中' };
        try {
          const { job_id } = await api('/api/repos/sync', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ full_name: r.full_name })
          });
          await pollJob(job_id, {
            onProgress(j) {
              progBar.style.width = (j.percent || 0) + '%';
              msg.textContent = (names[j.stage] || '处理中') + ' ' + (j.percent || 0) + '%';
            },
            onDone(j) {
              const res = j.result || {};
              progBar.style.width = '100%';
              msg.textContent = '已同步 ' + (res.build_version || '');
              msg.className = 'sync-msg ok';
              setTimeout(() => { prog.classList.remove('on'); loadRepos(); }, 700);
            },
            onError(err) {
              prog.classList.remove('on');
              showError(msg, err.message);
              syncBtn.disabled = false;
              swLabel.classList.remove('disabled');
            }
          });
        } catch (err) {
          prog.classList.remove('on');
          showError(msg, err.message);
          syncBtn.disabled = false;
          swLabel.classList.remove('disabled');
        }
      };
      right.appendChild(syncBtn);
      foot.appendChild(right);
      card.appendChild(foot);

      // 移动端折叠：收起为「图标+名称+摘要行」，状态并入摘要行
      addCollapse(card,
        (r.pgyer_linked && r.pgyer_version ? 'v' + r.pgyer_version : '—') + ' · ' +
        (ts ? relTime(ts) + '同步' : '尚未同步'));
      return card;
    }

    // 移动端折叠卡片：默认收起为「图标+名称+摘要行」，点卡片或箭头展开
    function addCollapse(card, sumText) {
      if (!window.matchMedia('(max-width: 900px)').matches) return;
      const statusEl = card.querySelector('.status');
      card.classList.add('collapsed');
      const row = el('div', 'card-summary');
      const sCls = (statusEl && statusEl.className.match(/\b(ok|bad|off|run|warn)\b/) || [])[1] || 'off';
      const st = el('span', 'sum-status ' + sCls);
      st.appendChild(el('span', 'dot'));
      st.appendChild(document.createTextNode(statusEl ? statusEl.textContent.trim() : '—'));
      row.appendChild(st);
      row.appendChild(el('span', 'sum-txt', sumText));
      (statusEl || card.querySelector('.card-top')).insertAdjacentElement('afterend', row);
      const chev = el('button', 'card-chev');
      chev.title = '展开 / 收起';
      chev.innerHTML = svg('chevronDown', 15);
      chev.onclick = e => { e.stopPropagation(); card.classList.toggle('collapsed'); };
      card.querySelector('.card-top').appendChild(chev);
      card.addEventListener('click', e => {
        if (e.target.closest('button, a, .switch-label')) return;
        if (card.classList.contains('collapsed')) card.classList.remove('collapsed');
      });
    }

    /* ---------- 渲染：列表 ---------- */
    function render() {
      const apps = repos.filter(r => r.is_app);
      renderStats(apps);

      let list = apps.slice();
      if (keyword) {
        const k = keyword.toLowerCase();
        list = list.filter(r => r.full_name.toLowerCase().includes(k) || (r.description || '').toLowerCase().includes(k));
      }
      if (filter === 'synced') list = list.filter(r => r.last_synced_tag);
      if (filter === 'unsynced') list = list.filter(r => !r.last_synced_tag);

      if (sortBy === 'name') list.sort((a, b) => a.full_name.localeCompare(b.full_name));
      else if (sortBy === 'release') list.sort((a, b) => (b.latest_published_at || '').localeCompare(a.latest_published_at || ''));
      else list.sort((a, b) => syncedUnix(b) - syncedUnix(a));

      document.getElementById('repoCount').textContent = '共 ' + apps.length + ' 个应用';

      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      list.forEach(r => grid.appendChild(renderCard(r)));

      const empty = document.getElementById('empty');
      if (list.length) {
        empty.style.display = 'none';
      } else {
        empty.style.display = 'block';
        empty.innerHTML = '';
        const icon = el('div', 'empty-icon');
        icon.innerHTML = svg('box', 48);
        empty.appendChild(icon);
        empty.appendChild(el('div', '', apps.length ? '没有符合条件的应用' : '还没有应用，点击右上角「添加应用」'));
      }
    }

    function renderPills() {
      const defs = [['all', '全部'], ['synced', '已同步'], ['unsynced', '未同步']];
      const box = document.getElementById('pills');
      box.innerHTML = '';
      defs.forEach(([key, label]) => {
        const b = el('button', 'pill' + (filter === key ? ' active' : ''), label);
        b.onclick = () => { filter = key; renderPills(); render(); };
        box.appendChild(b);
      });
    }

    function renderDeployPills() {
      const defs = [['all', '全部'], ['ok', '成功'], ['bad', '失败'], ['run', '进行中']];
      const box = document.getElementById('deployPills');
      box.innerHTML = '';
      defs.forEach(([key, label]) => {
        const b = el('button', 'pill' + (deployFilter === key ? ' active' : ''), label);
        b.onclick = () => { deployFilter = key; renderDeployPills(); renderDeployments(); };
        box.appendChild(b);
      });
    }

    /* ---------- 渲染：部署视图 ---------- */
    function deployStatusKey(svc) {
      const l = svc.latest;
      if (!l) return 'off';
      return runStatus(l.status).cls;
    }

    function renderDeployStats(list) {
      // 只留「服务总数」和「运行失败」：成功/进行中的数量已由下方筛选 pill 与
      // 「共 N 个服务（自动发现…）」覆盖，重复展示没有额外信息
      const items = [
        { label: '服务', value: list.length, icon: 'rocket' },
        { label: '运行失败', value: list.filter(s => deployStatusKey(s) === 'bad').length, icon: 'close' }
      ];
      const box = document.getElementById('deployStats');
      box.innerHTML = '';
      items.forEach(it => {
        const card = el('div', 'stat');
        const icon = el('div', 'stat-icon');
        icon.innerHTML = svg(it.icon, 22);
        card.appendChild(icon);
        const body = el('div', 'stat-body');
        body.appendChild(el('div', 'stat-label', it.label));
        body.appendChild(el('div', 'stat-value', String(it.value)));
        card.appendChild(body);
        const arrow = el('div', 'stat-arrow');
        arrow.innerHTML = svg('chevronRight', 18);
        card.appendChild(arrow);
        box.appendChild(card);
      });
    }

    function renderServiceCard(svc) {
      const card = el('div', 'card');

      const top = el('div', 'card-top');
      const st = tileStyle(svc.full_name, 'cpu'); // 部署视图 = 后端服务，统一芯片图标
      const tile = el('div', 'tile');
      tile.style.background = st.background;
      tile.innerHTML = svg(st.icon, 22);
      top.appendChild(tile);

      const title = el('div', 'card-title');
      const name = el('div', 'card-name');
      const a = el('a', '', svc.full_name);
      a.href = svc.html_url; a.target = '_blank'; a.rel = 'noopener';
      name.appendChild(a);
      title.appendChild(name);
      title.appendChild(el('div', 'card-desc', svc.description || svc.workflow_names.join(' · ')));
      top.appendChild(title);

      const moreBtn = el('button', 'icon-btn');
      moreBtn.innerHTML = svg('dots', 18);
      moreBtn.title = '更多操作';
      moreBtn.onclick = e => {
        e.stopPropagation();
        openMenu(moreBtn, [
          {
            icon: 'external', label: '打开仓库',
            onClick: () => window.open(svc.html_url, '_blank', 'noopener')
          },
          {
            icon: 'play', label: '查看运行日志',
            disabled: !(svc.latest && svc.latest.html_url),
            onClick: () => window.open(svc.latest.html_url, '_blank', 'noopener')
          }
        ]);
      };
      top.appendChild(moreBtn);
      card.appendChild(top);

      const l = svc.latest;
      if (!l) {
        const none = el('span', 'status off');
        none.appendChild(el('span', 'dot'));
        none.appendChild(document.createTextNode('尚无运行记录'));
        card.appendChild(none);
        card.appendChild(el('div', 'wf-names', 'workflow：' + svc.workflow_names.join(' · ')));
      } else {
        const rs = runStatus(l.status);
        const status = el('span', 'status ' + rs.cls);
        status.appendChild(el('span', 'dot'));
        status.appendChild(document.createTextNode(rs.text));
        card.appendChild(status);

        const meta = el('div', 'run-meta');
        meta.appendChild(el('span', '', l.name));
        meta.appendChild(el('span', 'sep', '·'));
        meta.appendChild(el('span', '', '#' + l.run_number));
        if (l.branch) {
          meta.appendChild(el('span', 'sep', '·'));
          meta.appendChild(el('span', '', l.branch));
        }
        card.appendChild(meta);

        if (l.title) {
          const commit = el('div', 'commit', l.title);
          commit.title = l.title;
          card.appendChild(commit);
        }

        const time = el('div', 'time');
        time.innerHTML = svg('clock', 14);
        const bits = [relTime(isoUnix(l.updated_at))];
        if (l.duration_sec) bits.push(formatDur(l.duration_sec));
        time.appendChild(document.createTextNode(bits.filter(Boolean).join(' · ')));
        time.title = localTime(isoUnix(l.updated_at));
        card.appendChild(time);

        if (svc.recent && svc.recent.length > 1) {
          const hist = el('div', 'history');
          svc.recent.slice(1).forEach(r => {
            const d = el('span', 'hist-dot ' + runStatus(r.status).cls);
            d.title = r.name + ' #' + r.run_number + ' · ' + runStatus(r.status).text;
            hist.appendChild(d);
          });
          card.appendChild(hist);
        }
      }

      const foot = el('div', 'card-foot');
      const svcPlat = platformBadge(svc.platform);
      if (svcPlat) foot.appendChild(svcPlat);
      const wf = el('div', 'wf-names', svc.workflow_names.join(' · '));
      wf.title = 'workflow：' + svc.workflow_names.join(' · ');
      foot.appendChild(wf);

      const right = el('div', 'foot-right');
      const btn = el('button', 'btn');
      btn.innerHTML = svg('external', 16);
      btn.appendChild(el('span', '', '运行日志'));
      if (!(l && l.html_url)) btn.disabled = true;
      btn.title = svc.private
        ? '私有仓库：需在已登录 GitHub 的浏览器中打开，否则 GitHub 返回 404'
        : '在 GitHub 上查看这次运行的日志';
      btn.onclick = () => window.open(l.html_url, '_blank', 'noopener');
      right.appendChild(btn);
      foot.appendChild(right);
      card.appendChild(foot);

      // 移动端折叠：摘要 = 运行名 #次数 · 分支 · 时间（无记录则显示 workflow 名）
      addCollapse(card,
        l
          ? [l.name + ' #' + l.run_number, l.branch, relTime(isoUnix(l.updated_at))].filter(Boolean).join(' · ')
          : 'workflow：' + svc.workflow_names.join(' · '));
      return card;
    }

    function renderDeployments() {
      // 应用仓库（如 music-flutter）已在「应用」视图展示，这里排除避免重复
      const appNames = new Set(repos.filter(r => r.is_app).map(r => r.full_name));
      const visible = services.filter(s => !appNames.has(s.full_name));

      renderDeployStats(visible);

      let list = visible.slice();
      if (keyword) {
        const k = keyword.toLowerCase();
        list = list.filter(s =>
          s.full_name.toLowerCase().includes(k) ||
          (s.description || '').toLowerCase().includes(k) ||
          (s.workflow_names || []).join(' ').toLowerCase().includes(k)
        );
      }
      if (deployFilter !== 'all') list = list.filter(s => deployStatusKey(s) === deployFilter);

      if (deploySortBy === 'name') list.sort((a, b) => a.full_name.localeCompare(b.full_name));
      else list.sort((a, b) => isoUnix((b.latest || {}).updated_at) - isoUnix((a.latest || {}).updated_at));

      document.getElementById('serviceCount').textContent = '共 ' + visible.length + ' 个服务（自动发现带 workflow 的仓库，应用除外）';

      const grid = document.getElementById('deployGrid');
      grid.innerHTML = '';
      list.forEach(s => grid.appendChild(renderServiceCard(s)));

      const empty = document.getElementById('deployEmpty');
      if (list.length) {
        empty.style.display = 'none';
      } else {
        empty.style.display = 'block';
        empty.innerHTML = '';
        const icon = el('div', 'empty-icon');
        icon.innerHTML = svg('rocket', 48);
        empty.appendChild(icon);
        empty.appendChild(el('div', '', visible.length || services.length ? '没有符合条件的服务' : '没有发现配置了 GitHub Actions 的仓库'));
      }
    }

    async function loadDeployments(force) {
      if (deployLoaded && !force) return;
      try {
        const data = await api('/api/deployments');
        services = data.services || [];
        deployLoaded = true;
        renderDeployments();
        render(); // 应用卡片合并了构建信息，部署数据到位后重渲染一次
      } catch (e) {
        const banner = document.getElementById('banner');
        banner.textContent = '加载部署信息失败：' + e.message;
        banner.classList.add('show');
      }
    }

    /* ---------- 渲染：前端站点（Cloudflare Pages） ---------- */
    function pagesStatusOf(p) {
      const l = p.latest;
      if (!l) return { cls: 'off', text: '暂无部署', icon: 'clock' };
      return runStatus(l.status);
    }

    function pagesStatusKey(p) {
      const l = p.latest;
      if (!l) return 'off';
      return runStatus(l.status).cls;
    }

    function renderPagesStats(list) {
      const items = [
        { label: '站点', value: list.length, icon: 'cloud' },
        { label: '最近成功', value: list.filter(p => pagesStatusKey(p) === 'ok').length, icon: 'check' },
        { label: '最近失败', value: list.filter(p => pagesStatusKey(p) === 'bad').length, icon: 'close' },
        { label: '构建中', value: list.filter(p => pagesStatusKey(p) === 'run').length, icon: 'refresh' }
      ];
      const box = document.getElementById('pagesStats');
      box.innerHTML = '';
      items.forEach(it => {
        const card = el('div', 'stat');
        const icon = el('div', 'stat-icon');
        icon.innerHTML = svg(it.icon, 22);
        card.appendChild(icon);
        const body = el('div', 'stat-body');
        body.appendChild(el('div', 'stat-label', it.label));
        body.appendChild(el('div', 'stat-value', String(it.value)));
        card.appendChild(body);
        const arrow = el('div', 'stat-arrow');
        arrow.innerHTML = svg('chevronRight', 18);
        card.appendChild(arrow);
        box.appendChild(card);
      });
    }

    function renderPagesPills() {
      const defs = [['all', '全部'], ['ok', '成功'], ['bad', '失败'], ['run', '构建中']];
      const box = document.getElementById('pagesPills');
      box.innerHTML = '';
      defs.forEach(([key, label]) => {
        const b = el('button', 'pill' + (pagesFilter === key ? ' active' : ''), label);
        b.onclick = () => { pagesFilter = key; renderPagesPills(); renderPages(); };
        box.appendChild(b);
      });
    }

    function renderPagesCard(p) {
      const card = el('div', 'card');

      const top = el('div', 'card-top');
      const st = tileStyle(p.name, 'cloud'); // 前端站点 = 云图标
      const tile = el('div', 'tile');
      tile.style.background = st.background;
      tile.innerHTML = svg(st.icon, 22);
      top.appendChild(tile);

      const title = el('div', 'card-title');
      const name = el('div', 'card-name');
      const a = el('a', '', p.name);
      a.href = p.site_url; a.target = '_blank'; a.rel = 'noopener';
      name.appendChild(a);
      title.appendChild(name);
      title.appendChild(el('div', 'card-desc',
        (p.custom_domains && p.custom_domains.length ? p.custom_domains.join(' · ') : p.subdomain) || ''));
      top.appendChild(title);

      const moreBtn = el('button', 'icon-btn');
      moreBtn.innerHTML = svg('dots', 18);
      moreBtn.title = '更多操作';
      moreBtn.onclick = e => {
        e.stopPropagation();
        const items = [
          { icon: 'external', label: '打开站点', onClick: () => window.open(p.site_url, '_blank', 'noopener') },
          { icon: 'cloud', label: '在 Cloudflare 打开', onClick: () => window.open(p.dashboard_url, '_blank', 'noopener') }
        ];
        if (p.latest && p.latest.url) {
          items.push({ icon: 'globe', label: '打开该次部署', onClick: () => window.open(p.latest.url, '_blank', 'noopener') });
        }
        openMenu(moreBtn, items);
      };
      top.appendChild(moreBtn);
      card.appendChild(top);

      const l = p.latest;
      const ps = pagesStatusOf(p);
      const status = el('span', 'status ' + ps.cls);
      status.appendChild(el('span', 'dot'));
      status.appendChild(document.createTextNode(ps.text));
      card.appendChild(status);

      if (!l) {
        const wf = el('div', 'wf-names', '生产分支 ' + (p.production_branch || '-'));
        card.appendChild(wf);
      } else {
        const meta = el('div', 'run-meta');
        meta.appendChild(el('span', '', l.environment === 'preview' ? '预览' : '生产'));
        if (l.branch) {
          meta.appendChild(el('span', 'sep', '·'));
          meta.appendChild(el('span', '', l.branch));
        }
        if (l.commit_short) {
          meta.appendChild(el('span', 'sep', '·'));
          meta.appendChild(el('span', '', l.commit_short));
        }
        if (l.stage) {
          meta.appendChild(el('span', 'sep', '·'));
          meta.appendChild(el('span', '', l.stage));
        }
        card.appendChild(meta);

        if (l.commit_message) {
          const first = l.commit_message.split('\n')[0];
          const commit = el('div', 'commit', first);
          commit.title = l.commit_message;
          card.appendChild(commit);
        }

        const time = el('div', 'time');
        time.innerHTML = svg('clock', 14);
        const bits = [relTime(isoUnix(l.created_on))];
        if (l.duration_sec) bits.push(formatDur(l.duration_sec));
        time.appendChild(document.createTextNode(bits.filter(Boolean).join(' · ')));
        time.title = localTime(isoUnix(l.created_on));
        card.appendChild(time);

        if (p.recent && p.recent.length > 1) {
          const hist = el('div', 'history');
          p.recent.slice(1).forEach(d => {
            const rs = runStatus(d.status);
            const dot = el('span', 'hist-dot ' + rs.cls);
            dot.title = (d.commit_short || d.short_id) + ' · ' + rs.text + ' · ' + localTime(isoUnix(d.created_on));
            hist.appendChild(dot);
          });
          card.appendChild(hist);
        }
      }

      const foot = el('div', 'card-foot');
      const pgPlat = platformBadge(p.platform);
      if (pgPlat) foot.appendChild(pgPlat);
      const wf = el('div', 'wf-names', '生产分支 ' + (p.production_branch || '-'));
      wf.title = '自定义域名：' + ((p.custom_domains && p.custom_domains.length) ? p.custom_domains.join(' · ') : '无');
      foot.appendChild(wf);

      const right = el('div', 'foot-right');
      const btn = el('button', 'btn');
      btn.innerHTML = svg('external', 16);
      btn.appendChild(el('span', '', '打开站点'));
      btn.title = '打开 ' + p.site_url;
      btn.onclick = () => window.open(p.site_url, '_blank', 'noopener');
      right.appendChild(btn);
      foot.appendChild(right);
      card.appendChild(foot);

      // 移动端折叠：摘要 = 环境 · commit · 时间
      addCollapse(card,
        l
          ? [(l.environment === 'preview' ? '预览' : '生产'), l.commit_short, relTime(isoUnix(l.created_on))].filter(Boolean).join(' · ')
          : '暂无部署');
      return card;
    }

    function renderPages() {
      renderPagesStats(pages);

      let list = pages.slice();
      if (keyword) {
        const k = keyword.toLowerCase();
        list = list.filter(p =>
          p.name.toLowerCase().includes(k) ||
          (p.subdomain || '').toLowerCase().includes(k) ||
          (p.custom_domains || []).join(' ').toLowerCase().includes(k)
        );
      }
      if (pagesFilter !== 'all') list = list.filter(p => pagesStatusKey(p) === pagesFilter);
      list.sort((a, b) => isoUnix((b.latest || {}).created_on) - isoUnix((a.latest || {}).created_on));

      document.getElementById('pagesCount').textContent =
        '共 ' + pages.length + ' 个站点' + (pagesConfigured ? '' : '（未配置 Cloudflare 凭据）');

      const grid = document.getElementById('pagesGrid');
      grid.innerHTML = '';
      list.forEach(p => grid.appendChild(renderPagesCard(p)));

      const empty = document.getElementById('pagesEmpty');
      if (list.length) {
        empty.style.display = 'none';
      } else {
        empty.style.display = 'block';
        empty.innerHTML = '';
        const icon = el('div', 'empty-icon');
        icon.innerHTML = svg('cloud', 48);
        empty.appendChild(icon);
        if (!pagesConfigured) {
          empty.appendChild(el('div', '', '未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，无法读取 Pages 部署记录'));
        } else if (pages.length) {
          empty.appendChild(el('div', '', '没有符合条件的站点'));
        } else {
          empty.appendChild(el('div', '', '该账号下没有 Cloudflare Pages 站点'));
        }
      }
    }

    async function loadPages(force) {
      if (pagesLoaded && !force) return;
      try {
        const data = await api('/api/pages');
        pagesConfigured = !!data.configured;
        pages = data.projects || [];
        pagesLoaded = true;
        renderPages();
      } catch (e) {
        const banner = document.getElementById('banner');
        banner.textContent = '加载前端站点失败：' + e.message;
        banner.classList.add('show');
      }
    }

    function renderSettings() {
      const panel = document.getElementById('settingsPanel');
      panel.innerHTML = '';
      const tag = ok => {
        const t = el('span', 'tag ' + (ok ? 'ok' : 'bad'));
        t.appendChild(el('span', 'dot'));
        t.appendChild(document.createTextNode(ok ? '已配置' : '未配置'));
        return t;
      };
      // 只保留「凭据配没配」这类能解释其它页面为什么为空的信息。
      // 归属者 / 同步间隔 / 数据文件 / Pages 过滤等属于固定环境变量：留空时行值就是行描述的复述，
      // 展示价值低，故不再单独占行（这些值仍可从 /api/health 查看）。
      let rows = [
        ['GITHUB_TOKEN', tag(!!health.github_token)],
        ['PGYER_API_KEY', tag(!!health.pgyer_key)],
        ['CLOUDFLARE_API_TOKEN', tag(!!health.cloudflare_token)],
        ['CLOUDFLARE_ACCOUNT_ID', tag(!!health.cloudflare_account_id)]
      ];
      if (authConfig.required) {
        // 「登录鉴权」不再单列：能进到这一页本身就说明是登录态，恒为「已配置」
        rows = [
          ['当前账号', el('span', 'row-value', authGet('email') || health.account_email || '已登录')]
        ].concat(rows);
      }
      // 配置项描述：说明每个 Token/参数的实际用途
      const SETTING_DESCS = {
        GITHUB_TOKEN: '调用 GitHub API：拉取应用 Release、部署运行状态，读取 workflow 内容做平台检测',
        PGYER_API_KEY: '将应用 APK 同步发布到蒲公英，供手机端下载安装',
        CLOUDFLARE_API_TOKEN: '读取 Cloudflare Pages 部署记录，驱动「前端站点」视图',
        CLOUDFLARE_ACCOUNT_ID: 'Cloudflare 账户标识，与上方 Token 配套用于定位 Pages 项目'
      };
      rows.forEach(([label, node]) => {
        const row = el('div', 'row');
        const main = el('div', 'row-main');
        main.appendChild(el('div', 'row-label', label));
        if (SETTING_DESCS[label]) main.appendChild(el('div', 'row-desc', SETTING_DESCS[label]));
        row.appendChild(main);
        if (node.classList.contains('row-value')) row.appendChild(node);
        else { const w = el('div'); w.appendChild(node); row.appendChild(w); }
        panel.appendChild(row);
      });

      if (authConfig.required) {
        const row = el('div', 'row');
        row.appendChild(el('div', 'row-label', '会话'));
        const wrap = el('div');
        const out = el('button', 'btn', '退出登录');
        out.onclick = async () => {
          out.disabled = true;
          out.textContent = '退出中…';
          await ucLogout();
          location.reload();
        };
        wrap.appendChild(out);
        row.appendChild(wrap);
        panel.appendChild(row);
      }
    }

    function renderModal() {
      const list = document.getElementById('modalList');
      list.innerHTML = '';
      repos.forEach(r => {
        const row = el('label', 'modal-row');
        const cb = el('input');
        cb.type = 'checkbox';
        cb.checked = r.is_app;
        cb.onchange = async () => {
          cb.disabled = true;
          try {
            await api('/api/repos/mark', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ full_name: r.full_name, marked: cb.checked })
            });
            r.is_app = cb.checked;
            r.marked = cb.checked;
            r.marked_set = true;
            render();
          } catch (e) {
            cb.checked = !cb.checked;
            openDetail('操作失败', e.message);
          } finally {
            cb.disabled = false;
          }
        };
        row.appendChild(cb);
        const info = el('div', 'modal-info');
        info.appendChild(el('div', 'modal-name', r.full_name));
        const meta = el('div', 'modal-meta');
        const bits = [];
        if (r.language) bits.push(r.language);
        if (r.latest_tag) bits.push('最新 ' + r.latest_tag);
        if (r.private) bits.push('私有');
        if (r.archived) bits.push('已归档');
        meta.textContent = bits.join(' · ') || '无 Release 信息';
        info.appendChild(meta);
        row.appendChild(info);
        list.appendChild(row);
      });
    }

    /* ---------- 事件绑定 ---------- */
    let activeView = 'apps';

    document.getElementById('searchInput').addEventListener('input', e => {
      keyword = e.target.value.trim();
      if (activeView === 'deployments') renderDeployments();
      else if (activeView === 'frontends') renderPages();
      else render();
    });
    setupSortButton('sortBtn',
      { recent: '最近更新', name: '名称', release: '最新发布' },
      () => sortBy,
      v => { sortBy = v; render(); });
    setupSortButton('deploySortBtn',
      { recent: '最近运行', name: '名称' },
      () => deploySortBy,
      v => { deploySortBy = v; renderDeployments(); });
    document.getElementById('refreshBtn').onclick = () => {
      if (activeView === 'deployments') return loadDeployments(true);
      if (activeView === 'frontends') return loadPages(true);
      return loadRepos();
    };
    const openAddModal = () => {
      document.getElementById('modalMask').classList.add('show');
      renderModal();
    };
    document.getElementById('addBtn').onclick = openAddModal;
    // 移动端悬浮按钮：与「添加应用」同流程
    const fabBtn = document.getElementById('fabBtn');
    fabBtn.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>';
    fabBtn.onclick = openAddModal;
    document.getElementById('closeModal').onclick = () => document.getElementById('modalMask').classList.remove('show');
    document.getElementById('closeDetail').onclick = () => document.getElementById('detailMask').classList.remove('show');
    document.getElementById('modalMask').addEventListener('click', e => {
      if (e.target.id === 'modalMask') e.target.classList.remove('show');
    });
    document.getElementById('detailMask').addEventListener('click', e => {
      if (e.target.id === 'detailMask') e.target.classList.remove('show');
    });
    document.addEventListener('click', closeMenus);
    document.addEventListener('scroll', closeMenus, true);
    window.addEventListener('resize', closeMenus);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeMenus();
        document.getElementById('detailMask').classList.remove('show');
        document.getElementById('modalMask').classList.remove('show');
      }
    });

    // 视图切换：桌面侧栏 nav-item 与移动端底部 tab 共用
    function switchView(name) {
      activeView = name;
      document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === name));
      document.querySelectorAll('#tabbar .tab').forEach(b => b.classList.toggle('active', b.dataset.view === name));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + name).classList.add('active');
      document.getElementById('sortBtn').style.display = name === 'apps' ? '' : 'none';
      document.getElementById('addBtn').style.display = name === 'settings' ? 'none' : '';
      document.getElementById('fabBtn').classList.toggle('hidden', name !== 'apps');
      document.querySelector('.search').classList.toggle('hidden', name === 'settings');
      if (name === 'deployments') loadDeployments();
      if (name === 'frontends') loadPages();
      if (name === 'apps') loadDeployments(); // 应用卡片上合并展示构建信息，需要部署数据
      // 设置页的数据来自 /api/health 的配置明细：若首屏那次因令牌过期没拿到，这里补一次
      if (name === 'settings' && authConfig.required && health.github_token === undefined) loadHealth();
    }
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.onclick = () => switchView(btn.dataset.view);
    });
    document.querySelectorAll('#tabbar .tab').forEach(btn => {
      btn.onclick = () => switchView(btn.dataset.view);
    });

    /* ---------- 登录表单 ---------- */
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const err = document.getElementById('loginError');
      const btn = document.getElementById('loginSubmit');
      const label = btn.textContent;
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = '登录中…';
      try {
        await ucLogin(
          document.getElementById('loginEmail').value.trim(),
          document.getElementById('loginPassword').value
        );
        document.getElementById('loginPassword').value = '';
        hideLogin();
        await loadHealth();
        startApp();
      } catch (ex) {
        err.textContent = ex.message;
      } finally {
        btn.disabled = false;
        btn.textContent = label;
      }
    });

    /* ---------- 启动 ---------- */
    function startApp() {
      loadRepos();
      loadDeployments();
      loadPages();
    }

    (async function boot() {
      mountIcons();
      renderPills();
      renderDeployPills();
      renderPagesPills();
      // 幕布全程盖住页面：先拿到 /api/health 判定鉴权，揭幕时用户看到的
      // 直接是登录页或就绪的控制台，而不是先闪一下半成品页面
      await loadHealth();
      if (!authConfig.required) { hideVeil(); startApp(); return; }
      if (!authGet('access')) { showLogin(''); return; }
      // 已有令牌：先在幕后完成首屏加载（会话失效会在 api() 里 401→弹登录并揭幕）
      await Promise.race([
        Promise.allSettled([loadRepos(), loadDeployments(), loadPages()]),
        sleep(3500)  // 兜底：数据再慢也不能把用户晾在幕布后
      ]);
      if (!authGet('access')) return;  // 会话失效：登录框已弹出并揭幕
      hideVeil();
    })();
  </script>
</body>
</html>
