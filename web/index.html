<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CI/CD 管理平台</title>
  <style>
    :root {
      --bg: #070b16;
      --sidebar: #0a0f1e;
      --panel: #0d1424;
      --panel-hover: #101a2e;
      --border: #1c2438;
      --border-soft: #161e30;
      --text: #e8ecf5;
      --muted: #8b93a8;
      --muted-dim: #5d677d;
      --accent: #3b82f6;
      --accent-strong: #2563eb;
      --accent-soft: rgba(59, 130, 246, 0.12);
      --green: #22c55e;
      --green-soft: rgba(34, 197, 94, 0.12);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.12);
      --orange: #f59e0b;
      --radius-card: 14px;
      --radius-btn: 10px;
      --radius-tile: 12px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    body::after {
      content: '';
      position: fixed;
      left: -10%;
      bottom: -30%;
      width: 60%;
      height: 70%;
      background: radial-gradient(closest-side, rgba(37, 99, 235, 0.20), transparent);
      pointer-events: none;
      z-index: 0;
    }
    button { font-family: inherit; }
    input, select { font-family: inherit; }
    svg { display: block; }

    .app { display: flex; min-height: 100vh; position: relative; z-index: 1; }

    /* ---------- 侧边导航 ---------- */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: var(--sidebar);
      border-right: 1px solid var(--border-soft);
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 6px; }
    .brand-logo {
      width: 36px; height: 36px;
      border-radius: var(--radius-btn);
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; color: #fff;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
      flex-shrink: 0;
    }
    .brand-name { font-size: 16px; font-weight: 600; letter-spacing: 0.2px; }
    .nav { display: flex; flex-direction: column; gap: 6px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      width: 100%;
      padding: 11px 12px;
      border-radius: var(--radius-btn);
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .nav-item:hover { background: rgba(255, 255, 255, 0.03); color: var(--text); }
    .nav-item.active {
      background: var(--accent-soft);
      border-color: rgba(59, 130, 246, 0.45);
      color: #fff;
      font-weight: 500;
    }
    .nav-item.active .nav-icon { color: #7eb0ff; }
    .nav-icon { color: inherit; flex-shrink: 0; }
    .nav-label { flex: 1; }

    /* ---------- 主区域 ---------- */
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 28px;
      border-bottom: 1px solid var(--border-soft);
      position: sticky; top: 0; z-index: 20;
      background: rgba(7, 11, 22, 0.86);
      backdrop-filter: blur(10px);
    }
    .search {
      position: relative;
      flex: 1;
      max-width: 380px;
    }
    .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted-dim); }
    .search input {
      width: 100%;
      padding: 10px 12px 10px 38px;
      border-radius: var(--radius-btn);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color .15s, background .15s;
    }
    .search input::placeholder { color: var(--muted-dim); }
    .search input:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.06); }
    .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }

    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 15px;
      border-radius: var(--radius-btn);
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background .15s, border-color .15s, opacity .15s;
    }
    .btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.07); border-color: #2b3550; }
    .btn.primary {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
      color: #fff;
      font-weight: 500;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.28);
    }
    .btn.primary:hover:not(:disabled) { background: #1d4ed8; border-color: #1d4ed8; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.icon-only { padding: 9px 11px; }

    .content { padding: 26px 28px 60px; }
    .view { display: none; }
    .view.active { display: block; }

    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .page-head h1 { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: 0.2px; }
    .page-head p { margin: 7px 0 0; color: var(--muted); font-size: 14px; }

    .banner {
      display: none;
      margin-bottom: 18px;
      padding: 12px 16px;
      border-radius: var(--radius-btn);
      font-size: 13px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: var(--orange);
    }
    .banner.show { display: block; }

    /* ---------- 统计卡 ---------- */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 30px; }
    .stat {
      display: flex; align-items: center; gap: 14px;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      cursor: default;
    }
    .stat-icon {
      width: 44px; height: 44px; flex-shrink: 0;
      border-radius: var(--radius-tile);
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.9), rgba(99, 102, 241, 0.9));
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.25);
    }
    .stat-body { flex: 1; min-width: 0; }
    .stat-label { font-size: 13px; color: var(--muted); }
    .stat-value { font-size: 26px; font-weight: 650; line-height: 1.25; letter-spacing: 0.3px; }
    .stat-arrow { color: var(--muted-dim); flex-shrink: 0; }

    /* ---------- 分区头 ---------- */
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .section-head h2 { margin: 0; font-size: 18px; font-weight: 600; }
    .section-head .sub { margin: 5px 0 0; font-size: 13px; color: var(--muted); }
    .section-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .pills { display: flex; gap: 4px; padding: 3px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border); border-radius: var(--radius-btn); }
    .pill {
      padding: 6px 13px; border-radius: 7px; border: none; background: transparent;
      color: var(--muted); font-size: 13px; cursor: pointer; transition: background .15s, color .15s;
    }
    .pill:hover { color: var(--text); }
    .pill.active { background: var(--accent-strong); color: #fff; font-weight: 500; }
    .select-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      border-radius: var(--radius-btn);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text); font-size: 13px; cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .select-btn:hover { background: rgba(255, 255, 255, 0.07); border-color: #2b3550; }
    .select-btn .chev { color: var(--muted-dim); }

    /* ---------- 应用卡片 ---------- */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
    .card {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 18px;
      display: flex; flex-direction: column; gap: 13px;
      transition: border-color .15s, background .15s, transform .15s;
    }
    .card:hover { border-color: #2a3550; background: var(--panel-hover); }
    .card-top { display: flex; align-items: flex-start; gap: 13px; }
    .tile {
      width: 46px; height: 46px; flex-shrink: 0;
      border-radius: var(--radius-tile);
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
    }
    .card-title { flex: 1; min-width: 0; }
    .card-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-name a { color: var(--text); text-decoration: none; }
    .card-name a:hover { color: #8fb8ff; }
    /* 固定占两行高度，避免描述长短不一导致卡片内部错位 */
    .card-desc {
      margin-top: 4px; font-size: 12.5px; color: var(--muted); line-height: 1.5;
      height: 3em;
      overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      word-break: break-word;
    }
    .icon-btn {
      background: transparent; border: none; color: var(--muted);
      padding: 4px; border-radius: 7px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.07); color: var(--text); }

    .status {
      display: inline-flex; align-items: center; gap: 6px;
      align-self: flex-start;
      padding: 3px 11px 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      border: 1px solid transparent;
    }
    .status .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status.ok { background: var(--green-soft); color: var(--green); border-color: rgba(34, 197, 94, 0.28); }
    .status.warn { background: rgba(245, 158, 11, 0.12); color: var(--orange); border-color: rgba(245, 158, 11, 0.28); }
    .status.off { background: rgba(255, 255, 255, 0.05); color: var(--muted-dim); border-color: var(--border); }
    .status.bad { background: var(--red-soft); color: #ff8f8f; border-color: rgba(239, 68, 68, 0.3); }
    .status.run { background: var(--accent-soft); color: #7eb0ff; border-color: rgba(59, 130, 246, 0.35); }

    .run-meta { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
    .run-meta .sep { color: var(--muted-dim); }
    .commit {
      font-size: 12.5px; color: var(--text); opacity: 0.85;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .history { display: flex; align-items: center; gap: 4px; }
    .hist-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted-dim); flex-shrink: 0; }
    .hist-dot.ok { background: var(--green); }
    .hist-dot.bad { background: var(--red); }
    .hist-dot.run { background: var(--accent); }
    .wf-names {
      font-size: 12.5px; color: var(--muted);
      min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* 只让 footer 里的 workflow 名占用剩余宽度并收缩，
       否则长文本会把右侧的「私有」标签挤变形。卡片纵向布局下不能加 flex-grow */
    .card-foot > .wf-names { flex: 1 1 auto; }

    .badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .badge {
      display: inline-flex; align-items: center;
      font-size: 11px; line-height: 1.7;
      padding: 0 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge.auto { color: #7eb0ff; border-color: rgba(59, 130, 246, 0.5); background: var(--accent-soft); }
    .badge.manual { color: var(--orange); border-color: rgba(245, 158, 11, 0.45); background: rgba(245, 158, 11, 0.1); }
    .badge.env { color: var(--muted-dim); flex-shrink: 0; }

    .versions { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 600; flex-wrap: wrap; }
    .versions .cur { color: var(--muted); font-weight: 500; }
    .versions .arrow { color: var(--muted-dim); flex-shrink: 0; }
    .versions .next { color: var(--text); }
    .versions .next.none { color: var(--muted-dim); font-weight: 500; }

    .time { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }
    .time svg { flex-shrink: 0; color: var(--muted-dim); }

    /* 应用卡片上合并展示的构建信息（Actions 最近运行） */
    .build-line { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--muted); min-width: 0; }
    .build-line.link { cursor: pointer; }
    .build-line.link:hover .build-status { text-decoration: underline; text-underline-offset: 3px; }
    .build-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; flex-shrink: 0; }
    .build-status .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .build-status.ok { color: var(--green); }
    .build-status.bad { color: #ff8f8f; }
    .build-status.off { color: var(--muted-dim); }
    .build-status.run { color: #7eb0ff; }
    .build-meta { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .progress { display: none; height: 5px; border-radius: 4px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
    .progress.on { display: block; }
    .progress-bar { height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, #3b82f6, #6366f1); transition: width .3s; }

    .card-foot { display: flex; align-items: center; gap: 10px; margin-top: auto; padding-top: 3px; }

    /* 平台品牌徽章（每张卡片只标主体所在的一个平台） */
    .plat { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .plat-ico {
      width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 3px rgba(0,0,0,.45);
    }
    .plat-ico svg { width: 11px; height: 11px; display: block; }
    .plat-name { font-size: 10.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
    .switch-label { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .switch { position: relative; width: 38px; height: 22px; border-radius: 999px; background: #2a3247; transition: background .2s; flex-shrink: 0; }
    .switch::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 16px; height: 16px; border-radius: 50%; background: #8b93a8;
      transition: transform .2s, background .2s;
    }
    .switch.on { background: var(--accent-strong); }
    .switch.on::after { transform: translateX(16px); background: #fff; }
    .switch-label.disabled { opacity: 0.5; cursor: not-allowed; }
    .foot-right { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; flex-shrink: 0; }
    .sync-msg {
      font-size: 12px; color: var(--muted);
      max-width: 170px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sync-msg.ok { color: var(--green); }
    .sync-msg.err { color: var(--red); }
    .detail-link { color: var(--accent); cursor: pointer; text-decoration: none; }
    .detail-link:hover { text-decoration: underline; }
    .spin {
      display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px;
      border: 2px solid rgba(255, 255, 255, 0.18); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty { color: var(--muted); text-align: center; padding: 70px 20px; }
    .empty .empty-icon { margin: 0 auto 14px; width: 48px; height: 48px; color: var(--muted-dim); }

    /* ---------- 弹出菜单 ---------- */
    .pop-menu {
      position: fixed; z-index: 200;
      min-width: 190px;
      background: #101828;
      border: 1px solid var(--border);
      border-radius: var(--radius-btn);
      padding: 6px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      display: none;
    }
    .pop-menu.show { display: block; }
    .pop-item {
      display: flex; align-items: center; gap: 9px;
      width: 100%; padding: 9px 11px;
      background: transparent; border: none; border-radius: 7px;
      color: var(--text); font-size: 13px; text-align: left; cursor: pointer;
    }
    .pop-item > span { flex: 1; }
    .pop-item:hover:not(:disabled) { background: rgba(255, 255, 255, 0.06); }
    .pop-item:disabled { color: var(--muted-dim); cursor: not-allowed; }
    .pop-item.active { color: #8fb8ff; }
    .pop-item .tick { color: var(--accent); flex-shrink: 0; }
    .pop-item.danger { color: #ff8f8f; }
    .pop-item.danger:hover:not(:disabled) { background: rgba(239, 68, 68, 0.12); }

    /* ---------- 弹窗 ---------- */
    .modal-mask {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(3, 6, 14, 0.7);
      backdrop-filter: blur(3px);
      display: none; align-items: center; justify-content: center;
    }
    .modal-mask.show { display: flex; }
    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      width: min(560px, calc(100vw - 40px));
      max-height: 80vh;
      display: flex; flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border-soft);
    }
    .modal-title { font-size: 15px; font-weight: 600; }
    .modal-close {
      background: transparent; border: none; color: var(--muted);
      font-size: 21px; line-height: 1; padding: 2px 6px; border-radius: 6px; cursor: pointer;
    }
    .modal-close:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }
    .modal-tip { padding: 14px 18px 4px; font-size: 12.5px; color: var(--muted); }
    .modal-list { overflow-y: auto; padding: 10px 12px 14px; }
    .modal-row { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 9px; cursor: pointer; }
    .modal-row:hover { background: rgba(255, 255, 255, 0.04); }
    .modal-row input { width: 16px; height: 16px; accent-color: var(--accent-strong); cursor: pointer; flex-shrink: 0; }
    .modal-info { min-width: 0; }
    .modal-name { font-size: 13.5px; font-weight: 500; word-break: break-all; }
    .modal-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .detail-body {
      padding: 16px 18px; overflow-y: auto;
      font-size: 12.5px; line-height: 1.7; color: var(--text);
      word-break: break-all; white-space: pre-wrap;
    }

    /* ---------- 设置 ---------- */
    .panel {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius-card); padding: 6px 18px; max-width: 720px;
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 15px 0; border-bottom: 1px solid var(--border-soft); }
    .row:last-child { border-bottom: none; }
    .row-label { font-size: 13.5px; color: var(--muted); }
    .row-value { font-size: 13.5px; font-weight: 500; text-align: right; word-break: break-all; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; flex-shrink: 0; white-space: nowrap; }
    .tag.ok { background: var(--green-soft); color: var(--green); border: 1px solid rgba(34, 197, 94, 0.28); }
    .tag.bad { background: var(--red-soft); color: #ff8f8f; border: 1px solid rgba(239, 68, 68, 0.28); }
    .tag .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    @media (max-width: 1180px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
    /* 移动端专属节点（桌面隐藏）：底部 Tab 栏 / FAB；设置页隐藏搜索框；设置行描述 */
    .tabbar, .fab { display: none; }
    .search.hidden { display: none; }
    .row-main { min-width: 0; }
    .row-desc { font-size: 11.5px; color: var(--muted-dim); margin-top: 3px; line-height: 1.45; }
    @media (max-width: 900px) {
      .sidebar { display: none; }
      .content { padding: 20px 16px calc(78px + env(safe-area-inset-bottom)); }
      .topbar { padding: 14px 16px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .page-head h1 { font-size: 20px; }

      /* ---------- 底部 Tab 栏 ---------- */
      .tabbar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
        display: flex;
        height: calc(62px + env(safe-area-inset-bottom));
        padding-bottom: env(safe-area-inset-bottom);
        background: rgba(10, 15, 30, 0.92);
        backdrop-filter: blur(12px);
        border-top: 1px solid var(--border-soft);
      }
      .tab {
        flex: 1; border: none; background: none; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
        padding: 8px 0 6px;
        color: var(--muted-dim); font-size: 11px; position: relative;
      }
      .tab svg { width: 21px; height: 21px; }
      .tab.active { color: #7eb0ff; }

      /* ---------- 悬浮按钮 ---------- */
      .fab {
        position: fixed; right: 18px; bottom: calc(78px + env(safe-area-inset-bottom)); z-index: 90;
        width: 52px; height: 52px; border-radius: 16px; border: none; cursor: pointer;
        background: var(--accent-strong); color: #fff;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 8px 24px rgba(37, 99, 235, 0.45);
        transition: transform .15s;
      }
      .fab:active { transform: scale(.9); }
      .fab.hidden { display: none; }
    }

    /* ---------- 折叠卡片（仅移动端启用，见 addCollapse） ---------- */
    .card-summary {
      display: none; align-items: center; gap: 10px;
      margin-top: 11px; padding-top: 11px; border-top: 1px solid var(--border-soft);
      font-size: 12.5px; color: var(--muted); min-width: 0;
    }
    .card.collapsed .card-summary { display: flex; }
    .sum-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; flex-shrink: 0; }
    .sum-status .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .sum-status.ok { color: var(--green); }
    .sum-status.bad { color: #ff8f8f; }
    .sum-status.off { color: var(--muted-dim); }
    .sum-status.run { color: #7eb0ff; }
    .sum-status.warn { color: var(--orange); }
    .card-summary .sum-txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-chev {
      width: 30px; height: 30px; border-radius: 9px; border: none; flex-shrink: 0;
      background: var(--panel-hover); color: var(--muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
    }
    .card-chev:active { background: rgba(255, 255, 255, 0.1); color: var(--text); }
    .card:not(.collapsed) .card-chev { color: var(--accent); background: var(--accent-soft); }
    .card-chev svg { transition: transform .2s; }
    .card:not(.collapsed) .card-chev svg { transform: rotate(180deg); }
    @media (max-width: 900px) {
      .card.collapsed > :not(.card-top):not(.card-summary) { display: none !important; }
    }

    /* ---------- 启动幕布：鉴权判定期间盖住控制台，避免「先见页面再弹登录」 ---------- */
    .boot-veil {
      position: fixed; inset: 0; z-index: 300;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      transition: opacity .28s ease;
    }
    .boot-veil.off { opacity: 0; pointer-events: none; }
    .veil-logo {
      font-size: 34px; color: var(--accent);
      text-shadow: 0 0 24px rgba(59, 130, 246, 0.5);
      animation: veilPulse 1.4s ease-in-out infinite;
    }
    @keyframes veilPulse {
      0%, 100% { opacity: .45; transform: scale(.94); }
      50% { opacity: 1; transform: scale(1); }
    }
    /* ---------- 登录门禁 ---------- */
    .login-mask {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(3, 6, 14, 0.85);
      backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center;
    }
    .login-mask.show { display: flex; }
    .login-box {
      width: min(380px, calc(100vw - 40px));
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 26px 24px 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }
    .login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .login-brand .brand-logo { font-size: 22px; color: var(--accent); }
    .login-brand .login-brand-name { font-size: 15px; font-weight: 600; }
    .login-tip { font-size: 12.5px; color: var(--muted); margin-bottom: 18px; }
    .login-field { margin-bottom: 12px; }
    .login-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .login-field input {
      width: 100%; box-sizing: border-box;
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); padding: 10px 12px;
      font-size: 13px; font-family: inherit; outline: none;
    }
    .login-field input:focus { border-color: var(--accent); }
    .login-error { min-height: 17px; margin: 2px 0 10px; font-size: 12px; color: #ef4444; }
    .login-submit { width: 100%; justify-content: center; }
  </style>

  <script>
    const ICONS = {
      home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5.6 9.7V20a1 1 0 0 0 1 1h10.8a1 1 0 0 0 1-1V9.7"/>',
      box: '<path d="m21 16-9 5-9-5V8l9-5 9 5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/>',
      gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>',
      refresh: '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3.5V9h-5.5"/>',
      plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
      rocket: '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>',
      arrowRight: '<path d="m9 6 6 6-6 6"/>',
      chevronRight: '<path d="m9 5 7 7-7 7"/>',
      chevronDown: '<path d="m6 9 6 6 6-6"/>',
      dots: '<circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/>',
      external: '<path d="M14 4h6v6"/><path d="m20 4-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
      close: '<path d="M6 6 18 18"/><path d="M18 6 6 18"/>',
      globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z"/>',
      layers: '<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
      smartphone: '<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
      cpu: '<rect x="6.5" y="6.5" width="11" height="11" rx="2"/><path d="M10 3v3.5"/><path d="M14 3v3.5"/><path d="M10 17.5V21"/><path d="M14 17.5V21"/><path d="M3 10h3.5"/><path d="M3 14h3.5"/><path d="M17.5 10H21"/><path d="M17.5 14H21"/>',
      check: '<path d="m5 13 4 4L19 7"/>',
      cloud: '<path d="M17.5 19a4.5 4.5 0 0 0 .5-8.97A6 6 0 0 0 6.2 9.2 4.5 4.5 0 0 0 7 19z"/>',
      play: '<circle cx="12" cy="12" r="9"/><path d="m10 8.5 6 3.5-6 3.5z"/>',
      trash: '<path d="M4 7h16"/><path d="M9.5 7V4.8h5V7"/><path d="m6.5 7 1 13h9l1-13"/>'
    };

    const GRADIENTS = [
      ['#3b82f6', '#8b5cf6'],
      ['#3b82f6', '#06b6d4'],
      ['#4f46e5', '#3b82f6'],
      ['#2563eb', '#7c3aed'],
      ['#0ea5e9', '#6366f1']
    ];

    let repos = [];
    let services = [];
    let health = {};
    let keyword = '';
    let filter = 'all';
    let sortBy = 'recent';
    let deployFilter = 'all';
    let deploySortBy = 'recent';
    let deployLoaded = false;
    let pages = [];
    let pagesConfigured = false;
    let pagesFilter = 'all';
    let pagesLoaded = false;

    /* ---------- 基础工具 ---------- */
    function svg(name, size) {
      const s = size || 18;
      return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" ' +
        'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        (ICONS[name] || '') + '</svg>';
    }

    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text !== undefined) n.textContent = text;
      return n;
    }

    function mountIcons(root) {
      (root || document).querySelectorAll('[data-icon]').forEach(node => {
        node.innerHTML = svg(node.getAttribute('data-icon'), Number(node.getAttribute('data-size')) || 18);
      });
    }

    /* ---------- 登录态（用户中心的 access_token）---------- */
    const AUTH_KEYS = {
      access: 'cicd_access_token',
      refresh: 'cicd_refresh_token',
      device: 'cicd_device_id',
      email: 'cicd_email'
    };
    // 由 /api/health 填充：是否需要登录、用户中心地址、本服务的 app 标识
    let authConfig = { required: false, app: 'cicd', url: '' };
    let refreshInflight = null;

    function authGet(key) { try { return localStorage.getItem(AUTH_KEYS[key]) || ''; } catch (e) { return ''; } }
    function authSet(key, value) {
      try { value ? localStorage.setItem(AUTH_KEYS[key], value) : localStorage.removeItem(AUTH_KEYS[key]); } catch (e) { /* 隐私模式下忽略 */ }
    }
    function authClear() { ['access', 'refresh', 'email'].forEach(k => authSet(k, '')); }

    // 设备标识持久化：用户中心靠它把令牌归到同一台设备，便于在「我的设备」里单独吊销
    function deviceId() {
      let d = authGet('device');
      if (!d) {
        d = 'web_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        authSet('device', d);
      }
      return d;
    }

    function ucEndpoint(path) { return authConfig.url.replace(/\/$/, '') + path; }

    async function ucAuth(path, payload) {
      const res = await fetch(ucEndpoint(path), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || data.error || ('请求失败 ' + res.status));
      return data;
    }

    async function ucLogin(email, password) {
      const data = await ucAuth('/v1/auth/login', {
        email, password, app: authConfig.app,
        device_id: deviceId(), device_name: 'CI/CD 管理平台', platform: 'web'
      });
      authSet('access', data.access_token);
      authSet('refresh', data.refresh_token);
      authSet('device', data.device_id);
      authSet('email', email);
      return data;
    }

    // 多个请求同时 401 时只刷新一次，避免刷新令牌被并发复用（会被判为泄露而吊销整条链）
    async function ucRefresh() {
      if (refreshInflight) return refreshInflight;
      const rt = authGet('refresh');
      if (!rt) throw new Error('未登录');
      refreshInflight = (async () => {
        const data = await ucAuth('/v1/auth/refresh', { refresh_token: rt, app: authConfig.app });
        authSet('access', data.access_token);
        authSet('refresh', data.refresh_token);
        return data;
      })();
      try { return await refreshInflight; } finally { refreshInflight = null; }
    }

    async function ucLogout() {
      const rt = authGet('refresh');
      if (rt && authConfig.url) {
        // 顺手在服务端吊销刷新令牌；失败也不影响本地退出
        try { await ucAuth('/v1/auth/logout', { refresh_token: rt }); } catch (e) { /* 忽略 */ }
      }
      authClear();
    }

    // 揭幕：幂等，首次调用后节点即从 DOM 移除
    function hideVeil() {
      const v = document.getElementById('bootVeil');
      if (v) { v.classList.add('off'); setTimeout(() => v.remove(), 320); }
    }

    function showLogin(message) {
      hideVeil();
      document.getElementById('loginError').textContent = message || '';
      document.getElementById('loginMask').classList.add('show');
      setTimeout(() => document.getElementById('loginEmail').focus(), 60);
    }
    function hideLogin() { document.getElementById('loginMask').classList.remove('show'); }
    function requireLogin(message) { authClear(); showLogin(message); }

    // 所有请求的统一出口：自动附访问令牌；401 时刷新一次再重试；仍失败则弹登录框。
    async function api(path, opts) {
      const req = opts || {};
      const send = () => {
        const headers = Object.assign({}, req.headers);
        const token = authGet('access');
        if (token) headers['Authorization'] = 'Bearer ' + token;
        return fetch(path, Object.assign({}, req, { headers }));
      };

      let res = await send();
      if (res.status === 401 && authConfig.required) {
        try {
          await ucRefresh();
          res = await send();
        } catch (e) {
          requireLogin('登录已过期，请重新登录');
          throw new Error('登录已过期');
        }
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('请求失败 ' + res.status));
      return data;
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function hash(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
      return h;
    }

    // 图标表达对象类型：部署视图=后端服务（芯片）、前端站点=云、应用=手机；
    // 卡片底部平台徽章负责标注真实平台（OCI / Cloudflare / 蒲公英）
    function tileStyle(name, icon) {
      const g = GRADIENTS[hash(name) % GRADIENTS.length];
      return { background: 'linear-gradient(135deg,' + g[0] + ',' + g[1] + ')', icon: icon || 'box' };
    }

    // 后端写入的时间是 UTC；老数据没有时区标记，补上 Z 才能解析成正确的瞬时。
    function parseTime(s) {
      if (!s) return 0;
      const hasZone = /[Zz]$|[+-]\d{2}:?\d{2}$/.test(s);
      const t = Date.parse(hasZone ? s : s.replace(' ', 'T') + 'Z');
      return isNaN(t) ? 0 : Math.floor(t / 1000);
    }

    function syncedUnix(r) {
      return r.last_synced_at_unix || parseTime(r.last_synced_at);
    }

    // 统一按浏览器本地时区展示
    function localTime(unix) {
      if (!unix) return '';
      return new Date(unix * 1000).toLocaleString('zh-CN', { hour12: false });
    }

    function relTime(unix) {
      if (!unix) return '';
      const diff = Math.floor(Date.now() / 1000) - unix;
      if (diff < 60) return '刚刚';
      if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
      if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
      if (diff < 86400 * 30) return Math.floor(diff / 86400) + ' 天前';
      return new Date(unix * 1000).toLocaleDateString('zh-CN');
    }

    function isoUnix(s) {
      if (!s) return 0;
      const t = Date.parse(s);
      return isNaN(t) ? 0 : Math.floor(t / 1000);
    }

    function formatDur(sec) {
      if (!sec || sec < 0) return '';
      if (sec < 60) return sec + 's';
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return m + 'm' + (s ? s + 's' : '');
    }

    // GitHub Actions 运行状态 → 展示用的文案与配色
    function runStatus(s) {
      switch (s) {
        case 'success': return { cls: 'ok', text: '成功', icon: 'check' };
        case 'failure': return { cls: 'bad', text: '失败', icon: 'close' };
        case 'cancelled': return { cls: 'off', text: '已取消', icon: 'close' };
        case 'skipped': return { cls: 'off', text: '已跳过', icon: 'close' };
        case 'in_progress': return { cls: 'run', text: '运行中', icon: 'refresh' };
        case 'queued': return { cls: 'run', text: '排队中', icon: 'clock' };
        case 'startup_failure': return { cls: 'bad', text: '启动失败', icon: 'close' };
        default: return { cls: 'off', text: s || '未知', icon: 'clock' };
      }
    }

    // platformBadge 返回单个平台徽章；平台为空或未知时返回 null（调用方跳过）
    function platformBadge(key) {
      const p = PLATFORMS[key];
      if (!p) return null;
