name: Deploy

# push 到 main 自动部署到本机（self-hosted runner 与服务同机，docker 部署）
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 支持在 GitHub 页面手动触发

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          # 不清理未跟踪文件，保住持久化的 data/ 目录
          clean: false

      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          GITHUB_TOKEN=${{ secrets.GH_TOKEN }}
          PGYER_API_KEY=${{ secrets.PGYER_API_KEY }}
          PORT=8090
          AUTO_SYNC_INTERVAL=5m
          GITHUB_OWNER=
          # Cloudflare Pages 部署记录（只读展示）
          CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }}
          # 只展示这些 Pages 项目（逗号分隔，留空=全部）
          CF_PAGES_PROJECTS=
          # 用户中心登录。URL 留空则鉴权关闭、接口对外开放，故这里必须填上。
          # 注意：.env 每次部署都会按本文件重新生成，改配置要改这里，别只改服务器上的 .env。
          USER_CENTER_URL=https://ucenter.june-t.top
          # 本服务在用户中心的标识，决定 JWT 的 aud，需与用户中心 APPS 一致
          USER_CENTER_APP=cicd
          # 邮箱白名单（逗号分隔），在「角色必须是 admin」之上再收窄。
          # 留空=任何管理员都能操作本面板
          ALLOWED_EMAILS=
          EOF
          chmod 600 .env

      - name: Backup current image
        run: sudo docker tag cicd-console:latest cicd-console:backup || true

      - name: Build & Up
        run: sudo docker compose up -d --build

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8090/api/health > /dev/null; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "部署失败，回滚旧镜像"
          sudo docker tag cicd-console:backup cicd-console:latest || true
          sudo docker compose up -d --no-build
